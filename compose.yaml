name: filinglens
services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: filinglens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
      POSTGRES_DB: filinglens
    ports: ["127.0.0.1:5438:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filinglens -d filinglens"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: &backend_build
      context: ./backend
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://filinglens:${POSTGRES_PASSWORD:-local-demo-password}@db:5432/filinglens
      STORAGE_DIR: /app/data/documents
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
      MAX_PAGE_TEXT_CHARS: ${MAX_PAGE_TEXT_CHARS:-250000}
      MAX_DOCUMENT_TEXT_CHARS: ${MAX_DOCUMENT_TEXT_CHARS:-10000000}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hash-v1}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-256}
      ANSWER_PROVIDER: ${ANSWER_PROVIDER:-extractive}
      ANSWER_MODEL: ${ANSWER_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      SENTIMENT_ENABLED: ${SENTIMENT_ENABLED:-false}
      NER_ENABLED: ${NER_ENABLED:-false}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-}
      PROVIDER_BASE_URL: ${PROVIDER_BASE_URL:-https://api.openai.com/v1}
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-30}
      PROVIDER_MAX_OUTPUT_TOKENS: ${PROVIDER_MAX_OUTPUT_TOKENS:-2048}
      PROVIDER_REASONING_EFFORT: ${PROVIDER_REASONING_EFFORT:-}
      INPUT_COST_PER_MILLION: ${INPUT_COST_PER_MILLION:-}
      OUTPUT_COST_PER_MILLION: ${OUTPUT_COST_PER_MILLION:-}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["documents:/app/data", "model_cache:/home/app/.cache/huggingface"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 20
  worker:
    build: *backend_build
    command: ["python", "-m", "app.worker"]
    environment: *backend_env
    volumes: ["documents:/app/data", "model_cache:/home/app/.cache/huggingface"]
    depends_on:
      backend: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend]
volumes:
  postgres_data:
  documents:
  model_cache:
