[project]
name = "filinglens"
version = "0.1.0"
description = "Evidence-first Indian financial filings intelligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.34.2", "sqlalchemy==2.0.40",
  "psycopg[binary]==3.2.6", "pgvector==0.4.0", "pydantic-settings==2.8.1",
  "python-multipart==0.0.32", "pymupdf==1.25.5", "httpx==0.28.1",
  "reportlab==4.4.0"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.11.8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
