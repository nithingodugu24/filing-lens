[project]
name = "filinglens"
version = "0.1.0"
description = "Evidence-first Indian financial filings intelligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.34.2", "sqlalchemy==2.0.40",
  "psycopg[binary]==3.2.6", "pgvector==0.4.0", "pydantic-settings==2.8.1",
  "python-multipart==0.0.32", "pymupdf==1.25.5", "httpx==0.28.1",
  "reportlab==4.4.0", "google-genai>=1.50,<2", "openpyxl>=3.1.5,<4",
  "passlib[bcrypt]==1.7.4", "bcrypt==4.0.1", "python-jose[cryptography]>=3.5,<4",
  "websockets>=15,<16", "matplotlib>=3.10,<4"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.11.8"]
ml = ["sentence-transformers>=5.1,<6", "torch>=2.6,<3", "transformers>=4.50,<5", "spacy>=3.8,<4"]
evaluation = ["rouge-score>=0.1.2,<0.2", "bert-score>=0.3.13,<0.4", "matplotlib>=3.10,<4"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
